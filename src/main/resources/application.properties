
spring.application.name=nova-siem-backend

# DATABASE
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
# Producción actual: update (sin cambios). Con Flyway verificado usar JPA_DDL_AUTO=validate y FLYWAY_ENABLED=true.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

# PAGINATION (Spring default is 20 rows per page with no upper bound policy)
spring.data.web.pageable.default-page-size=200
spring.data.web.pageable.max-page-size=1000

# SWAGGER / OPENAPI: disabled unless explicitly enabled (SWAGGER_ENABLED=true)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# FILE UPLOAD
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# SERVER
server.port=8080

# LOGGING
logging.level.org.springframework.security=INFO
logging.level.com.nova=INFO

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS (comma separated). Override with APP_CORS_ALLOWED_ORIGINS in production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,https://mellifluous-pavlova-db12a1.netlify.app}
